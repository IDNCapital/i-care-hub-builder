name: Public profile read states

on:
  pull_request:
    paths:
      - "src/pages/PraticienPublic.tsx"
      - "src/components/praticiens/FichePraticien.tsx"
      - "src/components/avis/SectionAvisGoogle.tsx"
      - "src/components/SeoHead.tsx"
      - "src/lib/siteUrl.ts"
      - "src/lib/brand.ts"
      - "src/lib/routes.ts"
      - "src/integrations/supabase/**"
      - "src/pages/admin/AdminPraticiens.tsx"
      - "tsconfig*.json"
      - "package*.json"
      - "bun.lock"
      - ".ci/public-profile/**"
      - ".github/workflows/public-profile-read-states.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .ci/public-profile/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install the frozen root dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the isolated pinned test tools without scripts
        run: npm ci --prefix .ci/public-profile --ignore-scripts --no-audit --no-fund
      - run: .ci/public-profile/node_modules/.bin/vitest run --config .ci/public-profile/vitest.config.ts
      - run: node_modules/.bin/eslint src/pages/PraticienPublic.tsx .ci/public-profile/PraticienPublic.fiabilite.test.tsx .ci/public-profile/vitest.config.ts
      - run: node_modules/.bin/tsc --noEmit -p .ci/public-profile/tsconfig.json
