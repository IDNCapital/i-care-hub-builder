name: Admin webhook read states

on:
  pull_request:
    paths:
      - "src/pages/admin/AdminWebhooks.tsx"
      - "src/integrations/supabase/**"
      - "tsconfig*.json"
      - "package*.json"
      - "bun.lock"
      - ".ci/admin-webhooks/**"
      - ".github/workflows/admin-webhooks-read-states.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .ci/admin-webhooks/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install the frozen root dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the isolated pinned test tools without scripts
        run: npm ci --prefix .ci/admin-webhooks --ignore-scripts --no-audit --no-fund
      - run: .ci/admin-webhooks/node_modules/.bin/vitest run --config .ci/admin-webhooks/vitest.config.ts
      - run: node_modules/.bin/eslint src/pages/admin/AdminWebhooks.tsx .ci/admin-webhooks/AdminWebhooks.lecture.test.tsx .ci/admin-webhooks/vitest.config.ts
      - run: node_modules/.bin/tsc --noEmit -p .ci/admin-webhooks/tsconfig.json
