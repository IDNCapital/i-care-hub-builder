name: Investor interest receipts

on:
  pull_request:
    paths:
      - "src/pages/InvestisseurInteret.tsx"
      - "src/integrations/supabase/**"
      - "tsconfig*.json"
      - "package*.json"
      - "bun.lock"
      - ".ci/investor-interest/**"
      - ".github/workflows/investor-interest-receipts.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .ci/investor-interest/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install the frozen root dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the isolated pinned test tools without scripts
        run: npm ci --prefix .ci/investor-interest --ignore-scripts --no-audit --no-fund
      - run: .ci/investor-interest/node_modules/.bin/vitest run --config .ci/investor-interest/vitest.config.ts
      - run: node_modules/.bin/eslint src/pages/InvestisseurInteret.tsx .ci/investor-interest/InvestisseurInteret.recu.test.tsx .ci/investor-interest/vitest.config.ts
      - run: node_modules/.bin/tsc --noEmit -p .ci/investor-interest/tsconfig.json
