name: Public reviews current cache

on:
  pull_request:
    paths:
      - "src/components/avis/SectionAvisGoogle.tsx"
      - "src/integrations/supabase/**"
      - "tsconfig*.json"
      - "package*.json"
      - "bun.lock"
      - ".ci/public-avis/**"
      - ".github/workflows/public-avis-cache.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .ci/public-avis/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install the frozen root dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the isolated pinned test tools without scripts
        run: npm ci --prefix .ci/public-avis --ignore-scripts --no-audit --no-fund
      - run: .ci/public-avis/node_modules/.bin/vitest run --config .ci/public-avis/vitest.config.ts
      - run: node_modules/.bin/eslint src/components/avis/SectionAvisGoogle.tsx .ci/public-avis/SectionAvisGoogle.cache.test.tsx .ci/public-avis/vitest.config.ts
      - run: node_modules/.bin/tsc --noEmit -p .ci/public-avis/tsconfig.json
