name: Public patients read states

on:
  pull_request:
    paths:
      - "src/pages/Patients.tsx"
      - "src/components/patients/**"
      - "src/hooks/usePraticiensPublics.ts"
      - "src/hooks/useSpecialites.ts"
      - "src/config/patientsIndex.ts"
      - "src/lib/taxonomy.ts"
      - "src/lib/norm.js"
      - "src/components/SeoHead.tsx"
      - "src/lib/siteUrl.ts"
      - "src/lib/brand.ts"
      - "src/lib/routes.ts"
      - "src/integrations/supabase/**"
      - "src/pages/admin/AdminPraticiens.tsx"
      - "tsconfig*.json"
      - "package*.json"
      - "bun.lock"
      - ".ci/public-patients/**"
      - ".github/workflows/public-patients-read-states.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .ci/public-patients/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install the frozen root dependencies without scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the isolated pinned test tools without scripts
        run: npm ci --prefix .ci/public-patients --ignore-scripts --no-audit --no-fund
      - run: .ci/public-patients/node_modules/.bin/vitest run --config .ci/public-patients/vitest.config.ts
      - run: node_modules/.bin/eslint src/pages/Patients.tsx src/components/patients/PatientsOuvert.tsx src/hooks/usePraticiensPublics.ts src/hooks/useSpecialites.ts .ci/public-patients/Patients.complet.test.tsx .ci/public-patients/hooks.complet.test.tsx .ci/public-patients/vitest.config.ts
      - run: node_modules/.bin/tsc --noEmit -p .ci/public-patients/tsconfig.json
